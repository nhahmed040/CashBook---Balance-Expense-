<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashBook – Balance &amp; Expense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>CashBook</h1>
      <p class="sub">Track your cash in, cash out and balance.</p>
    </header>

    <section class="summary" aria-label="Summary">
      <div class="card balance">
        <span class="label">Net balance</span>
        <span class="value" id="balance">0.00</span>
      </div>
      <div class="card in">
        <span class="label">Cash in</span>
        <span class="value" id="totalIn">0.00</span>
      </div>
      <div class="card out">
        <span class="label">Cash out</span>
        <span class="value" id="totalOut">0.00</span>
      </div>
    </section>

    <section class="panel">
      <h2>Add entry</h2>
      <form id="entryForm" autocomplete="off">
        <div class="toggle" role="radiogroup" aria-label="Entry type">
          <label><input type="radio" name="type" value="in" checked><span>Cash in</span></label>
          <label><input type="radio" name="type" value="out"><span>Cash out</span></label>
        </div>
        <div class="row">
          <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
          <input type="date" id="date" required>
        </div>
        <div class="row">
          <input type="text" id="category" placeholder="Category (e.g. Sales, Rent)" maxlength="40">
          <input type="text" id="note" placeholder="Remark (optional)" maxlength="80">
        </div>
        <button type="submit" class="primary">Add entry</button>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Entries</h2>
        <div class="tools">
          <select id="filter" aria-label="Filter entries">
            <option value="all">All</option>
            <option value="in">Cash in</option>
            <option value="out">Cash out</option>
          </select>
          <button type="button" id="exportBtn">Export CSV</button>
          <button type="button" id="clearBtn" class="danger">Clear all</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">No entries yet. Add your first one above.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
