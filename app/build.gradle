plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nhahmed.cashbook'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nhahmed.cashbook'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '2.3.0'
    }

    // A fixed key, so every build is signed the same way and a new APK can be
    // installed over the old one without uninstalling (which would erase your data).
    // This key is committed to the repo on purpose: it is for sideloading your own
    // build, not for publishing to an app store.
    signingConfigs {
        sideload {
            storeFile file('cashbook.keystore')
            storePassword 'cashbook-sideload'
            keyAlias 'cashbook'
            keyPassword 'cashbook-sideload'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The app UI is the web app in /web, shared with the browser version.
            assets.srcDirs = ['../web']
        }
    }
}

dependencies {
    // Google sign-in through Android's Credential Manager (Google blocks sign-in inside a WebView).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
