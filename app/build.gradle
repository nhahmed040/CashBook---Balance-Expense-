plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nhahmed.cashbook'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nhahmed.cashbook'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // A fixed key, so every build is signed the same way and a new APK can be
    // installed over the old one without uninstalling (which would erase your data).
    // This key is committed to the repo on purpose: it is for sideloading your own
    // build, not for publishing to an app store.
    signingConfigs {
        sideload {
            storeFile file('cashbook.keystore')
            storePassword 'cashbook-sideload'
            keyAlias 'cashbook'
            keyPassword 'cashbook-sideload'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The app UI is the web app in /web, shared with the browser version.
            assets.srcDirs = ['../web']
        }
    }
}
